<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - EarthenKnot</title>
  <link rel="stylesheet" href="styles.css?v=1.8">
  <style>
    .story-text {
      font-size: 1.15rem;
      color: var(--text-light);
      line-height: 1.8;
      margin-bottom: 2rem;
      position: relative;
      padding-left: 1.5rem;
      border-left: 3px solid var(--primary);
      font-style: italic;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-light);
      font-weight: 500;
      margin-bottom: 2rem;
      transition: color 0.3s;
    }
    .back-link:hover {
      color: var(--primary);
    }
    @media (max-width: 768px) {
      .product-top-grid {
        grid-template-columns: 1fr !important;
        gap: 2rem !important;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar" id="main-nav">
    <a href="index.html" class="logo">
      <img src="assets/logo.png" alt="EarthenKnot Logo">
      EarthenKnot
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <div class="dropdown">
        <a href="collections.html" class="dropbtn">Collections ▾</a>
        <div class="dropdown-content">
          <a href="collections.html">All Collections</a>
          <a href="home-decor.html">Home Decor</a>
          <a href="pillows.html">Pillows</a>
          <a href="tops.html">Tops</a>
          <a href="hair-accessories.html">Hair Accessories</a>

          <a href="scarves.html">Scarves</a>

      <a href="about.html">About</a>
      <a href="contact.html">Get in Touch</a>

    <div class="nav-actions">
      <div class="global-search-container" style="position: relative; display: flex; align-items: center;">
        <input type="text" id="global-search-input" class="search-input-expand" placeholder="Search products...">
        <button class="search-btn" id="global-search-btn" aria-label="Search" style="background: none; border: none; cursor: pointer; color: var(--text); padding: 0.5rem; transition: color 0.3s ease;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text)'">
          <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2;">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" x2="16.65" y1="21" y2="16.65"></line>
          </svg>
        </button>
        <div id="search-results-dropdown" class="search-results-dropdown"></div>
      </div>
      <div class="user-auth-container" style="position: relative;">
        <button class="user-btn" id="user-auth-btn" aria-label="Account" onclick="window.location.href='auth.html'">
          <span class="user-btn-label">Sign In</span>
        </button>
        <div class="user-dropdown" id="user-dropdown"></div>
      </div>
      <button class="wishlist-nav-btn" onclick="window.location.href='wishlist.html'" aria-label="View Wishlist" style="background: none; border: none; cursor: pointer; color: var(--text); padding: 0.5rem; transition: color 0.3s ease; position: relative; display: flex; align-items: center;" onmouseover="this.style.color='var(--secondary)'" onmouseout="this.style.color='var(--text)'">
        <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2;">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
      </button>
      <button class="cart-btn" onclick="window.location.href='checkout.html'" aria-label="View Cart">
        <svg viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </div>
  </nav>

  <main class="main-wrapper" style="padding: 2rem 5% 4rem 5%; min-height: 75vh; display: flex; align-items: center;">
    <section class="container" style="max-width: 1100px; width: 100%;">
      <a href="collections.html" class="back-link fade-in">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Back to Collections
      </a>
      <div id="product-detail-container" class="fade-in delay-1" style="display: block;">
        <!-- Dynamically injected by JS -->
      </div>
    </section>
  </main>
